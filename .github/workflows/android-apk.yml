name: android-apk

# 只出 APK，不碰版本号、tag 或 Release。
# 手动触发，或推送到 ci/android-apk 分支时自动跑。
on:
  workflow_dispatch:
  push:
    branches:
      - ci/android-apk

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            desktop-tauri/ui-kit/package-lock.json
            desktop-tauri/mobile/package-lock.json

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # v3 默认会安装 "tools platform-tools"，但新 SDK 仓库已没有
          # "tools" 这个包，setup 阶段会直接失败。cmdline-tools 由 action
          # 自己负责，这里只让它补 platform-tools。
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          sdkmanager --list_installed

      - name: Install frontend dependencies
        run: |
          set -euxo pipefail
          npm --prefix desktop-tauri/ui-kit ci
          npm --prefix desktop-tauri/mobile ci

      - name: Build web bundle for APK
        working-directory: desktop-tauri/mobile
        run: npm run build:native

      - name: Sync Capacitor Android project
        working-directory: desktop-tauri/mobile
        run: npx cap sync android

      - name: Prepare Android signing
        id: signing
        working-directory: desktop-tauri/mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > agent2api-release.jks
            STORE_PASSWORD="${ANDROID_KEYSTORE_PASSWORD:?missing keystore password}"
            KEY_ALIAS="${ANDROID_KEY_ALIAS:?missing key alias}"
            KEY_PASSWORD="${ANDROID_KEY_PASSWORD:?missing key password}"
            echo "key_source=repo-secret" >> "$GITHUB_OUTPUT"
          else
            STORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_PASSWORD="$STORE_PASSWORD"
            KEY_ALIAS="agent2api"
            keytool -genkeypair -v \
              -keystore agent2api-release.jks \
              -storetype JKS \
              -storepass "$STORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keypass "$KEY_PASSWORD" \
              -keyalg RSA -keysize 3072 -validity 10000 \
              -dname "CN=Agent2API CI, O=Agent2API, C=CN" >/dev/null 2>&1
            echo "key_source=ephemeral-ci-key" >> "$GITHUB_OUTPUT"
          fi

          keytool -list -keystore agent2api-release.jks \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          {
            printf 'storeFile=../agent2api-release.jks\n'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties

          # 工程的 gradle.properties 写死了 Windows 的 JDK 路径，Linux runner 上删掉，
          # 让 Gradle 使用 setup-java 提供的 JAVA_HOME。
          sed -i '/^[[:space:]]*org\.gradle\.java\.home=/d' gradle.properties

          # Wrapper 默认指腾讯镜像；CI 在国外，改用 Gradle 官方分发。
          sed -i 's|^distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.3-bin.zip|' \
            gradle/wrapper/gradle-wrapper.properties

      - name: Build release APK
        working-directory: desktop-tauri/mobile/android
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect and verify APK
        id: collect
        working-directory: desktop-tauri/mobile
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"

          mkdir -p dist
          OUT="dist/Agent2API-${VERSION}.apk"
          cp "$APK" "$OUT"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$OUT" | tee "dist/Agent2API-${VERSION}-signature.txt"

          sha256sum "$OUT" | tee "dist/Agent2API-${VERSION}.apk.sha256"
          ls -lh dist
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=desktop-tauri/mobile/$OUT" >> "$GITHUB_OUTPUT"

      - name: Write run summary
        run: |
          set -euo pipefail
          VERSION="${{ steps.collect.outputs.version }}"
          HASH="$(cut -d' ' -f1 desktop-tauri/mobile/dist/Agent2API-${VERSION}.apk.sha256)"
          {
            echo '### Agent2API Android APK'
            echo
            echo "- Version: \`${VERSION}\`"
            echo "- Signing: \`${{ steps.signing.outputs.key_source }}\`"
            echo "- SHA-256: \`${HASH}\`"
            echo "- Package: \`com.agent2api.mobile\`"
            echo
            echo 'Download the `android-apk` artifact below.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            desktop-tauri/mobile/dist/*.apk
            desktop-tauri/mobile/dist/*.sha256
            desktop-tauri/mobile/dist/*-signature.txt
          if-no-files-found: error
          retention-days: 14